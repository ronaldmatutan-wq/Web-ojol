<style>
* {margin: 0; padding: 0; box-sizing: border-box;}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  padding: 20px;
}
.header {
  display: flex;
  justify
 }

.send-btn {
  width: 32px;
  height: 32px;
  background: #0284c7;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin: 0;
  padding: 0;
  transition: opacity 0.15s;
}
.send-btn:hover { background: #0369a1; }
.send-btn:disabled { background: #1e293b; cursor: default; }
.send-btn svg { fill: white; }
.send-btn:disabled svg { fill: #475569; }

.quick-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 8px;
}
.chip {
  padding: 5px 10px;
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 14px;
  font-size: 11px;
  color: #64748b;
  cursor: pointer;
  font-family: inherit;
}
.chip:active { border-color: #38bdf8; color: #38bdf8; }
/* ===== END CHAT ===== */
</style>
</head>

<div class="header">
  <div class="logo">KamOj Workspace</div>
  <button class="theme-toggle" onclick="alert('Fitur tema nyusul bangg 😎')">Light/Dark</button>
</div>

<div class="grid">

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <script src="https://jsdelivr.net"></script>
    <script defer src="https://jsdelivr.net"></script>
</head>
<body class="bg-[#171717] text-[#ececec] antialiased" x-data="chatApp()">

    <div class="flex h-screen overflow-hidden">
        
        <!-- SIDEBAR PENGATURAN -->
        <div :class="sidebarOpen ? 'w-80' : 'w-0 overflow-hidden'" class="bg-[#0d0d0d] border-r border-[#2f2f2f] transition-all duration-300 flex flex-col justify-between shrink-0">
            <div class="p-5">
                <div class="flex items-center gap-3 mb-8">
                    <span class="text-2xl">💬</span>
                    <h1 class="text-lg font-semibold">AI Chatbot Config</h1>
                </div>
                <div class="space-y-5">
                    <div>
                        <label class="block text-xs font-medium text-[#b4b4b4] mb-2 uppercase">Pilih AI Provider</label>
                        <select x-model="apiProvider" class="w-full bg-[#212121] border border-[#2f2f2f] rounded-lg px-3 py-2 text-sm text-white">
                            <option value="openai">OpenAI (ChatGPT)</option>
                            <option value="gemini">Google Gemini</option>
                            <option value="anthropic">Anthropic (Claude)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-[#b4b4b4] mb-2 uppercase">Input API Key</label>
                        <input type="password" placeholder="sk-..." x-model="apiKey" class="w-full bg-[#212121] border border-[#2f2f2f] rounded-lg px-3 py-2 text-sm text-white font-mono" />
                    </div>
                </div>
            </div>
            <div class="p-5 border-t border-[#2f2f2f]">
                <button @click="clearChat()" class="w-full bg-[#212121] text-neutral-400 hover:text-red-400 py-2 rounded-lg text-sm border border-[#2f2f2f]">
                    🗑️ Hapus Riwayat Chat
                </button>
            </div>
        </div>

        <!-- UTAMA CHAT -->
        <div class="flex-1 flex flex-col bg-[#212121]">
            <header class="h-14 border-b border-[#2f2f2f] flex items-center justify-between px-6 bg-[#171717]">
                <button @click="sidebarOpen = !sidebarOpen" class="text-xl">⚙️</button>
                <div class="flex items-center gap-2 bg-[#0d0d0d] px-3 py-1.5 rounded-full border border-[#2f2f2f]">
                    <span :class="apiKey ? 'bg-emerald-500 animate-pulse' : 'bg-rose-500'" class="h-2 w-2 rounded-full"></span>
                    <span class="text-xs text-[#b4b4b4]" x-text="apiKey ? 'Terhubung (' + apiProvider.toUpperCase() + ')' : 'Belum Terhubung'"></span>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto px-4 py-6">
                <div class="max-w-2xl mx-auto space-y-6">
                    <template x-if="messages.length === 0">
                        <div class="text-center py-20">
                            <span class="text-5xl block mb-4">🤖</span>
                            <h3 class="text-lg font-medium">Ada yang bisa saya bantu?</h3>
                        </div>
                    </template>
                    <template x-for="msg in messages" :key="msg.id">
                        <div :class="msg.sender === 'user' ? 'justify-end' : 'justify-start'" class="flex">
                            <div :class="msg.sender === 'user' ? 'bg-[#2f2f2f]' : 'bg-[#171717] border border-[#2f2f2f]'" class="max-w-[85%] rounded-2xl px-4 py-3 text-sm relative group">
                                <p class="whitespace-pre-wrap" x-text="msg.text"></p>
                                <template x-if="msg.sender === 'ai'">
                                    <button @click="copyText(msg.text)" class="text-xs text-emerald-400 mt-2 block">📋 Salin</button>
                                </template>
                            </div>
                        </div>
                    </template>
                    <div id="anchor"></div>
                </div>
            </div>

            <div class="p-4 border-t border-[#2f2f2f] bg-[#171717]">
                <form @submit.prevent="sendMessage()" class="max-w-2xl mx-auto flex items-center gap-2 bg-[#212121] border border-[#2f2f2f] rounded-xl p-1.5">
                    <input type="text" :placeholder="apiKey ? 'Ketik pesan...' : 'Isi API Key dulu...'" x-model="inputText" :disabled="!apiKey" class="flex-1 bg-transparent px-3 py-2 text-sm text-white focus:outline-none" />
                    <button type="submit" :disabled="!inputText.trim() || !apiKey" class="p-2 bg-emerald-600 text-white rounded-lg text-sm">Kirim</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function chatApp() {
            return {
                sidebarOpen: true, inputText: '',
                apiProvider: localStorage.getItem('chat_provider') || 'openai',
                apiKey: localStorage.getItem('chat_api_key') || '',
                messages: [],
                init() {
                    this.$watch('apiProvider', v => localStorage.setItem('chat_provider', v));
                    this.$watch('apiKey', v => localStorage.setItem('chat_api_key', v));
                },
                sendMessage() {
                    if (!this.inputText.trim()) return;
                    this.messages.push({ id: Date.now(), text: this.inputText, sender: 'user' });
                    const provider = this.apiProvider;
                    this.inputText = '';
                    setTimeout(() => {
                        this.messages.push({ id: Date.now()+1, text: `[Simulasi ${provider.toUpperCase()}] Pesan terkirim dan dibalas otomatis. UI berfungsi normal.`, sender: 'ai' });
                        document.getElementById("anchor")?.scrollIntoView({ behavior: "smooth" });
                    }, 500);
                },
                copyText(txt) { navigator.clipboard.writeText(txt); alert('Tersalin!'); },
                clearChat() { if (confirm('Hapus riwayat?')) this.messages = []; }
            }
        }
    </script>
</body>
                </html>

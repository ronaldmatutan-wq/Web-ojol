
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KamOj Workspace - Dashboard Produktivitas & AI</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f172a; color: #e2e8f0; padding: 20px;
        }
       .header {display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;}
       .logo {font-size: 24px; font-weight: 700; color: #38bdf8;}
       .theme-toggle {background: #1e293b; border: none; color: #38bdf8; padding: 8px 12px; border-radius: 8px; cursor: pointer;}
       .grid {display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;}
       .card {
            background: #1e293b; border: 1px solid #334155; 
            border-radius: 12px; padding: 20px;
        }
       .card h3 {color: #38bdf8; margin-bottom: 15px; font-size: 16px;}
        input, textarea, button {
            width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; 
            border: 1px solid #334155; background: #0f172a; color: #e2e8f0;
        }
        button {background: #0284c7; border: none; cursor: pointer; font-weight: 600;}
        button:hover {background: #0369a1;}
        #todoList li {list-style: none; padding: 8px; background: #0f172a; margin: 5px 0; border-radius: 6px; display: flex; justify-content: space-between;}
        #timer {font-size: 48px; text-align: center; margin: 15px 0; color: #38bdf8; font-weight: 700;}
       .timer-btns {display: flex; gap: 10px;}
       .timer-btns button {flex: 1;}
        #chatBox {height: 200px; overflow-y: auto; background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 14px;}
       .msg-user {color: #38bdf8; margin: 5px 0;}
       .msg-ai {color: #a3e635; margin: 5px 0;}
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">KamOj Workspace</div>
        <button class="theme-toggle" onclick="alert('Fitur tema nyusul bangg 😎')">Light/Dark</button>
    </div>

    <div class="grid">
        <!-- Manajer Tugas -->
        <div class="card">
            <h3>Manajer Tugas</h3>
            <input type="text" id="todoInput" placeholder="Nama tugas baru...">
            <button onclick="addTodo()">Tambah Tugas</button>
            <ul id="todoList"></ul>
        </div>

        <!-- Pengatur Waktu Fokus -->
        <div class="card">
            <h3>Pengatur Waktu Fokus</h3>
            <div id="timer">25:00</div>
            <div class="timer-btns">
                <button onclick="startTimer()">Mulai</button>
                <button onclick="resetTimer()">Reset</button>
            </div>
        </div>

        <!-- Catatan Cepat + AI -->
        <div class="card">
            <h3>Catatan Cepat + KamOj G2 AI</h3>
            <input type="password" id="apiKey" placeholder="Tempel API Key Gemini AIza...">
            <div id="chatBox"></div>
            <textarea id="userInput" rows="2" placeholder="Tanya KamOj G2..."></textarea>
            <button onclick="askKamoj()">Tanya KamOj</button>
        </div>

        <!-- Bookmark AI -->
        <div class="card">
            <h3>Bookmark AI & Alur</h3>
            <input type="text" id="linkInput" placeholder="Tempel link HF Space / API...">
            <button onclick="addLink()">Simpan Link</button>
            <ul id="linkList"></ul>
        </div>
    </div>

<script>
    // === TODO ===
    let todos = JSON.parse(localStorage.getItem('todos')) || [];
    function renderTodos() {
        document.getElementById('todoList').innerHTML = todos.map((t,i) => 
            `<li>${t} <span onclick="delTodo(${i})" style="cursor:pointer;color:#f87171">✕</span></li>`
        ).join('');
    }
    function addTodo() {
        const val = document.getElementById('todoInput').value;
        if(val) { todos.push(val); localStorage.setItem('todos', JSON.stringify(todos)); renderTodos(); document.getElementById('todoInput').value = ''; }
    }
    function delTodo(i) { todos.splice(i,1); localStorage.setItem('todos', JSON.stringify(todos)); renderTodos(); }
    renderTodos();

    // === POMODORO ===
    let time = 1500, timerRun = false, interval;
    function updateTimer() {
        const m = Math.floor(time/60), s = time%60;
        document.getElementById('timer').textContent = `${m}:${s<10?'0':''}${s}`;
    }
    function startTimer() {
        if(timerRun) return; timerRun = true;
        interval = setInterval(() => {
            if(time > 0) { time--; updateTimer(); } 
            else { clearInterval(interval); timerRun = false; alert('Waktu Fokus Selesai Bangg! 🔥'); }
        }, 1000);
    }
    function resetTimer() { clearInterval(interval); timerRun = false; time = 1500; updateTimer(); }

    // === BOOKMARK ===
    let links = JSON.parse(localStorage.getItem('links')) || [];
    function renderLinks() {
        document.getElementById('linkList').innerHTML = links.map((l,i) => 
            `<li><a href="${l}" target="_blank" style="color:#38bdf8">${l}</a> <span onclick="delLink(${i})" style="cursor:pointer;color:#f87171">✕</span></li>`
        ).join('');
    }
    function addLink() {
        const val = document.getElementById('linkInput').value;
        if(val) { links.push(val); localStorage.setItem('links', JSON.stringify(links)); renderLinks(); document.getElementById('linkInput').value = ''; }
    }
    function delLink(i) { links.splice(i,1); localStorage.setItem('links', JSON.stringify(links)); renderLinks(); }
    renderLinks();

    // === KAMOJ G2 AI GEMINI ===
    async function askKamoj() {
        const apiKey = document.getElementById('apiKey').value;
        const input = document.getElementById('userInput').value;
        const chatBox = document.getElementById('chatBox');
        if(!apiKey) return alert('Isi API Key Gemini dulu bangg!');
        if(!input) return;
        
        chatBox.innerHTML += `<div class="msg-user">Lo: ${input}</div>`;
        document.getElementById('userInput').value = '';
        chatBox.innerHTML += `<div class="msg-ai">KamOj G2: Mikir bentar bangg...</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({contents: [{parts: [{text: input}]}]})
            });
            const data = await res.json();
            const reply = data.candidates[0].content.parts[0].text;
            chatBox.lastChild.remove();
            chatBox.innerHTML += `<div class="msg-ai">KamOj G2: ${reply}</div>`;
        } catch(e) {
            chatBox.lastChild.remove();
            chatBox.innerHTML += `<div class="msg-ai">KamOj G2: Waduh eror bangg 😭 Cek API Key atau koneksi</div>`;
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>
</body>
</html>
